openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: wardrobe
    description: Garment capture, analysis, and wardrobe management
  - name: recommendations
    description: Outfit recommendations based on saved wardrobe items
  - name: storage
    description: Private image upload support
paths:
  /billing/plans:
    get:
      operationId: listBillingPlans
      summary: Pricing in paise; planned limits are not yet enforced
      responses:
        "200":
          description: Public catalog and payment readiness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingCatalog" }
  /billing/subscription:
    get:
      operationId: getBillingSubscription
      security: [{ BillingSession: [] }]
      responses:
        "200":
          description: Current billing state; no paid subscriptions are activated yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingSubscription" }
        "401": { $ref: "#/components/responses/BillingUnauthorized" }
  /billing/quotes:
    post:
      operationId: createBillingQuote
      summary: Save a 15-minute base-price quote; does not charge or redeem the launch offer
      security: [{ BillingSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillingQuoteInput" }
      responses:
        "201":
          description: Saved quote (same request key replays the same unexpired quote)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingQuote" }
        "400": { $ref: "#/components/responses/BillingBadRequest" }
        "401": { $ref: "#/components/responses/BillingUnauthorized" }
        "409": { $ref: "#/components/responses/BillingConflict" }
        "429":
          description: At most ten new quotes per user per 15 minutes; idempotent replays do not count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingError" }
        "503": { $ref: "#/components/responses/BillingUnavailable" }
  /billing/quotes/{quoteId}:
    get:
      operationId: getBillingQuote
      security: [{ BillingSession: [] }]
      parameters:
        - in: path
          name: quoteId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Owned quote, including its expiry timestamp
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingQuote" }
        "400": { $ref: "#/components/responses/BillingBadRequest" }
        "401": { $ref: "#/components/responses/BillingUnauthorized" }
        "404": { $ref: "#/components/responses/BillingNotFound" }
  /billing/checkout:
    post:
      operationId: startBillingCheckout
      summary: Create an idempotent manual UPI payment order for an owned quote
      description: Creates a pending order. A customer transaction reference never activates a subscription; a verified billing admin must approve it.
      security: [{ BillingSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillingCheckoutInput" }
      responses:
        "201":
          description: Pending manual UPI order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingOrder" }
        "400": { $ref: "#/components/responses/BillingBadRequest" }
        "401": { $ref: "#/components/responses/BillingUnauthorized" }
        "404": { $ref: "#/components/responses/BillingNotFound" }
        "409": { $ref: "#/components/responses/BillingConflict" }
        "503":
          description: Manual payment review has not been configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingCheckoutUnavailable" }
  /billing/orders/{orderId}:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getBillingOrder
      security: [{ BillingSession: [] }]
      responses:
        "200":
          description: An order owned by the signed-in user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingOrder" }
        "401": { $ref: "#/components/responses/BillingUnauthorized" }
        "404": { $ref: "#/components/responses/BillingNotFound" }
    post:
      operationId: submitBillingPayment
      summary: Submit a UPI transaction reference for manual review
      security: [{ BillingSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillingPaymentSubmission" }
      responses:
        "200":
          description: Order remains pending until an admin verifies the transfer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingOrder" }
        "400": { $ref: "#/components/responses/BillingBadRequest" }
        "401": { $ref: "#/components/responses/BillingUnauthorized" }
        "404": { $ref: "#/components/responses/BillingNotFound" }
        "409": { $ref: "#/components/responses/BillingConflict" }
  /billing/admin/orders:
    get:
      operationId: listBillingAdminOrders
      security: [{ BillingSession: [] }]
      responses:
        "200":
          description: Orders awaiting manual payment review
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BillingAdminOrder" }
        "401": { $ref: "#/components/responses/BillingUnauthorized" }
        "403": { $ref: "#/components/responses/BillingForbidden" }
        "503": { $ref: "#/components/responses/BillingUnavailable" }
  /billing/admin/orders/{orderId}/review:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: reviewBillingAdminOrder
      security: [{ BillingSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillingOrderReviewInput" }
      responses:
        "200":
          description: The order after the verified admin decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingAdminOrder" }
        "400": { $ref: "#/components/responses/BillingBadRequest" }
        "401": { $ref: "#/components/responses/BillingUnauthorized" }
        "403": { $ref: "#/components/responses/BillingForbidden" }
        "404": { $ref: "#/components/responses/BillingNotFound" }
        "409": { $ref: "#/components/responses/BillingConflict" }
        "503": { $ref: "#/components/responses/BillingUnavailable" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /storage/uploads/request-url:
    post:
      operationId: requestWardrobeUploadUrl
      tags: [storage]
      summary: Request a private upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
      responses:
        "200":
          description: Upload URL and private object path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadTarget"
  /wardrobe/analyze:
    post:
      operationId: analyzeGarment
      tags: [wardrobe]
      summary: Analyze uploaded garment photos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GarmentAnalysisInput"
      responses:
        "200":
          description: Structured visual garment analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GarmentAnalysis"
  /wardrobe/chat:
    post:
      operationId: chatAboutGarment
      tags: [wardrobe]
      summary: Continue a conversation about a garment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GarmentChatInput"
      responses:
        "200":
          description: Stylist reply with any useful confirmed field suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GarmentChatReply"
  /wardrobe/items:
    get:
      operationId: listWardrobeItems
      tags: [wardrobe]
      summary: List the signed-in user's saved garments
      responses:
        "200":
          description: Saved wardrobe items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WardrobeItem"
    post:
      operationId: saveWardrobeItem
      tags: [wardrobe]
      summary: Save a user-approved garment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WardrobeItemInput"
      responses:
        "201":
          description: Saved garment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WardrobeItem"
        "409":
          description: A matching photo is already in this wardrobe
  /wardrobe/summary:
    get:
      operationId: getWardrobeSummary
      tags: [wardrobe]
      summary: Get a compact wardrobe overview
      responses:
        "200":
          description: Wardrobe counts and recent items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WardrobeSummary"
  /wardrobe/recommendations:
    post:
      operationId: recommendOutfits
      tags: [recommendations]
      summary: Recommend outfits using a saved garment and the user's wardrobe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutfitRequest"
      responses:
        "200":
          description: Contextual outfit recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutfitResponse"
  /v1/profile:
    $ref: "./mvp.openapi.yaml#/paths/~1v1~1profile"
  /v1/uploads:
    $ref: "./mvp.openapi.yaml#/paths/~1v1~1uploads"
  /v1/wardrobe/scan:
    $ref: "./mvp.openapi.yaml#/paths/~1v1~1wardrobe~1scan"
  /v1/jobs/{jobId}:
    $ref: "./mvp.openapi.yaml#/paths/~1v1~1jobs~1{jobId}"
  /v1/jobs:
    $ref: "./mvp.openapi.yaml#/paths/~1v1~1jobs"
  /v1/wardrobe:
    $ref: "./mvp.openapi.yaml#/paths/~1v1~1wardrobe"
  /v1/wardrobe/{itemId}:
    $ref: "./mvp.openapi.yaml#/paths/~1v1~1wardrobe~1{itemId}"
  /v1/threads:
    $ref: "./mvp.openapi.yaml#/paths/~1v1~1threads"
  /v1/threads/{threadId}/messages:
    $ref: "./mvp.openapi.yaml#/paths/~1v1~1threads~1{threadId}~1messages"
  /v1/threads/{threadId}/styling-image:
    $ref: "./mvp.openapi.yaml#/paths/~1v1~1threads~1{threadId}~1styling-image"
  /v1/outfits:
    $ref: "./mvp.openapi.yaml#/paths/~1v1~1outfits"
  /v1/outfits/recommend:
    $ref: "./mvp.openapi.yaml#/paths/~1v1~1outfits~1recommend"
  /v1/outfits/{outfitId}/save:
    $ref: "./mvp.openapi.yaml#/paths/~1v1~1outfits~1{outfitId}~1save"
  /v1/outfits/{outfitId}/swap:
    $ref: "./mvp.openapi.yaml#/paths/~1v1~1outfits~1{outfitId}~1swap"
  /v1/outfits/{outfitId}/feedback:
    $ref: "./mvp.openapi.yaml#/paths/~1v1~1outfits~1{outfitId}~1feedback"
components:
  securitySchemes:
    BillingSession:
      type: http
      scheme: bearer
      description: Existing Clerk session, via bearer token or session cookie
  responses:
    BillingBadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BillingError" }
    BillingUnauthorized:
      description: Sign in required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BillingError" }
    BillingNotFound:
      description: Resource missing or owned by another user
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BillingError" }
    BillingForbidden:
      description: This account is not authorized for billing review
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BillingError" }
    BillingConflict:
      description: Expired quote or request key reused with different input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BillingError" }
    BillingUnavailable:
      description: Eligibility provider unavailable; no quote issued
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BillingError" }
  schemas:
    BillingError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    BillingReadiness:
      type: object
      required: [checkoutEnabled, mode, blockers]
      properties:
        checkoutEnabled: { type: boolean }
        mode: { type: string, enum: [disabled, manual_qr] }
        blockers: { type: array, items: { type: string } }
    BillingLimits:
      type: object
      required: [chatReplies, photoReviews, wardrobeItems, outfitRequests]
      properties:
        chatReplies: { type: integer, minimum: 0 }
        photoReviews: { type: integer, minimum: 0 }
        wardrobeItems: { type: integer, minimum: 0 }
        outfitRequests: { type: integer, minimum: 0 }
    BillingPlan:
      type: object
      required: [id, name, monthlyAmount, annualAmount, limits]
      properties:
        id: { type: string, enum: [free, plus, pro] }
        name: { type: string }
        monthlyAmount: { type: integer, minimum: 0 }
        annualAmount: { type: integer, minimum: 0 }
        limits: { $ref: "#/components/schemas/BillingLimits" }
    BillingCatalog:
      allOf:
        - $ref: "#/components/schemas/BillingReadiness"
        - type: object
          required: [currency, amountUnit, taxStatus, usageLimitsEnforced, plans]
          properties:
            currency: { type: string, enum: [INR] }
            amountUnit: { type: string, enum: [paise] }
            taxStatus: { type: string, enum: [not_configured] }
            usageLimitsEnforced: { type: boolean, enum: [false] }
            plans: { type: array, items: { $ref: "#/components/schemas/BillingPlan" } }
    BillingSubscription:
      allOf:
        - $ref: "#/components/schemas/BillingReadiness"
        - type: object
          required: [plan, status, launchOffer, usageLimitsEnforced, periodEndsAt]
          properties:
            plan: { type: string, enum: [free, plus, pro] }
            status: { type: string, enum: [no_paid_subscription, awaiting_payment, pending_review, active, expired, payment_rejected] }
            launchOffer: { type: string, enum: [eligible, redeemed, not_yet_evaluated] }
            usageLimitsEnforced: { type: boolean, enum: [false] }
            periodEndsAt: { type: ["string", "null"], format: date-time }
    BillingQuoteInput:
      type: object
      additionalProperties: false
      required: [plan, interval, requestKey]
      properties:
        plan: { type: string, enum: [plus, pro] }
        interval: { type: string, enum: [month, year] }
        requestKey: { type: string, format: uuid, description: Client-generated idempotency UUID, scoped to the signed-in user }
    BillingQuote:
      type: object
      required: [id, plan, interval, currency, amountUnit, regularAmount, firstTermAmount, discountPercent, renewalAmount, taxStatus, payable, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        plan: { type: string, enum: [plus, pro] }
        interval: { type: string, enum: [month, year] }
        currency: { type: string, enum: [INR] }
        amountUnit: { type: string, enum: [paise] }
        regularAmount: { type: integer, minimum: 0 }
        firstTermAmount: { type: integer, minimum: 0 }
        discountPercent: { type: integer, enum: [0, 70] }
        renewalAmount: { type: integer, minimum: 0 }
        taxStatus: { type: string, enum: [not_configured] }
        payable: { type: boolean }
        createdAt: { type: string }
        expiresAt: { type: string }
    BillingCheckoutInput:
      type: object
      additionalProperties: false
      required: [quoteId]
      properties:
        quoteId: { type: string, format: uuid }
    BillingCheckoutUnavailable:
      allOf:
        - $ref: "#/components/schemas/BillingReadiness"
        - type: object
          required: [error, code]
          properties:
            error: { type: string }
            code: { type: string, enum: [PAYMENTS_NOT_READY] }
    BillingOrder:
      type: object
      required: [id, quoteId, plan, interval, currency, amountUnit, firstTermAmount, regularAmount, discountPercent, status, transactionReference, submittedAt, reviewedAt, periodStartsAt, periodEndsAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        quoteId: { type: string, format: uuid }
        plan: { type: string, enum: [plus, pro] }
        interval: { type: string, enum: [month, year] }
        currency: { type: string, enum: [INR] }
        amountUnit: { type: string, enum: [paise] }
        firstTermAmount: { type: integer, minimum: 0 }
        regularAmount: { type: integer, minimum: 0 }
        discountPercent: { type: integer, enum: [0, 70] }
        status: { type: string, enum: [awaiting_payment, pending_review, approved, rejected] }
        transactionReference: { type: ["string", "null"], maxLength: 80 }
        submittedAt: { type: ["string", "null"], format: date-time }
        reviewedAt: { type: ["string", "null"], format: date-time }
        periodStartsAt: { type: ["string", "null"], format: date-time }
        periodEndsAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    BillingAdminOrder:
      allOf:
        - $ref: "#/components/schemas/BillingOrder"
        - type: object
          required: [userId]
          properties:
            userId: { type: string }
    BillingPaymentSubmission:
      type: object
      additionalProperties: false
      required: [transactionReference]
      properties:
        transactionReference: { type: string, minLength: 6, maxLength: 80, pattern: "^[A-Za-z0-9-]+$" }
    BillingOrderReviewInput:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    UploadRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 180
        size:
          type: integer
          minimum: 1
          maximum: 15728640
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
      required: [name, size, contentType]
    UploadTarget:
      type: object
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string, minLength: 1 }
      required: [uploadURL, objectPath]
    GarmentAnalysisInput:
      type: object
      properties:
        objectPaths:
          type: array
          minItems: 1
          maxItems: 5
          items: { type: string, minLength: 1 }
        userNote:
          type: string
          maxLength: 500
      required: [objectPaths]
    AttributeSource:
      type: object
      properties:
        attribute: { type: string }
        value: { type: string }
        source:
          type: string
          enum: [visually_observed, AI_estimate, user_provided, label_verified, externally_verified]
      required: [attribute, value, source]
    GarmentAnalysis:
      type: object
      properties:
        category: { type: string }
        subtype: { type: string }
        primaryColor: { type: string }
        secondaryColors:
          type: array
          items: { type: string }
        pattern: { type: string }
        designDetails:
          type: array
          items: { type: string }
        silhouette: { type: string }
        fitEstimate: { type: string }
        style: { type: string }
        fabricEstimate: { type: string }
        constructionFeatures:
          type: array
          items: { type: string }
        occasions:
          type: array
          items: { type: string }
        seasons:
          type: array
          items: { type: string }
        confidenceNote: { type: string }
        labelPhotoSuggestion: { type: boolean }
        attributeSources:
          type: array
          items: { $ref: "#/components/schemas/AttributeSource" }
      required:
        - category
        - subtype
        - primaryColor
        - secondaryColors
        - pattern
        - designDetails
        - silhouette
        - fitEstimate
        - style
        - fabricEstimate
        - constructionFeatures
        - occasions
        - seasons
        - confidenceNote
        - labelPhotoSuggestion
        - attributeSources
    GarmentChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content: { type: string, minLength: 1, maxLength: 2000 }
      required: [role, content]
    GarmentChatInput:
      type: object
      properties:
        analysis: { $ref: "#/components/schemas/GarmentAnalysis" }
        messages:
          type: array
          minItems: 1
          maxItems: 30
          items: { $ref: "#/components/schemas/GarmentChatMessage" }
        savedItemId:
          type: ["string", "null"]
      required: [analysis, messages]
    GarmentChatReply:
      type: object
      properties:
        reply: { type: string }
      required: [reply]
    WardrobeItemInput:
      type: object
      properties:
        imagePath: { type: string, minLength: 1 }
        additionalImagePaths:
          type: array
          maxItems: 4
          items: { type: string, minLength: 1 }
        category: { type: string }
        subtype: { type: string }
        primaryColor: { type: string }
        secondaryColors:
          type: array
          items: { type: string }
        pattern: { type: string }
        designDetails:
          type: array
          items: { type: string }
        silhouette: { type: string }
        fit: { type: ["string", "null"] }
        style: { type: string }
        fabricEstimate: { type: ["string", "null"] }
        fabricComposition: { type: ["string", "null"] }
        constructionFeatures:
          type: array
          items: { type: string }
        occasions:
          type: array
          items: { type: string }
        seasons:
          type: array
          items: { type: string }
        brand: { type: ["string", "null"] }
        size: { type: ["string", "null"] }
        purchasePrice: { type: ["number", "null"], minimum: 0 }
        purchaseDate: { type: ["string", "null"], format: date }
        notes: { type: ["string", "null"], maxLength: 2000 }
        attributeSources:
          type: array
          items: { $ref: "#/components/schemas/AttributeSource" }
        allowDuplicate: { type: boolean }
      required:
        - imagePath
        - additionalImagePaths
        - category
        - subtype
        - primaryColor
        - secondaryColors
        - pattern
        - designDetails
        - silhouette
        - fit
        - style
        - fabricEstimate
        - fabricComposition
        - constructionFeatures
        - occasions
        - seasons
        - brand
        - size
        - purchasePrice
        - purchaseDate
        - notes
        - attributeSources
        - allowDuplicate
    WardrobeItem:
      allOf:
        - $ref: "#/components/schemas/WardrobeItemInput"
        - type: object
          properties:
            id: { type: string }
            createdAt: { type: string, format: date-time }
          required: [id, createdAt]
    WardrobeSummary:
      type: object
      properties:
        totalItems: { type: integer }
        categoryCounts:
          type: object
          additionalProperties: { type: integer }
        recentItems:
          type: array
          items: { $ref: "#/components/schemas/WardrobeItem" }
      required: [totalItems, categoryCounts, recentItems]
    OutfitRequest:
      type: object
      properties:
        itemId: { type: string, minLength: 1 }
        prompt: { type: string, maxLength: 300 }
      required: [itemId]
    Outfit:
      type: object
      properties:
        name: { type: string }
        pieces:
          type: array
          items: { type: string }
        rationale: { type: string }
      required: [name, pieces, rationale]
    OutfitResponse:
      type: object
      properties:
        introduction: { type: string }
        outfits:
          type: array
          items: { $ref: "#/components/schemas/Outfit" }
      required: [introduction, outfits]

